name: lima-ci

on:
  push:
    branches: [main]
  pull_request:
    # Staged C/C++ integration stacks target codex/* branches before main.
    branches: [main, "codex/**"]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

concurrency:
  group: lima-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  quality-contracts:
    name: quality-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q lima scripts tests
      - name: Verify CI, frontend, and experiment contracts
        run: >-
          python -m unittest -v tests.test_ci_contract
          tests.test_frontend_ui tests.test_experiments

  unit-tests:
    name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete unit and integration suite
        run: >-
          python scripts/run_ci_tests.py
          --output output/ci/unit-${{ runner.os }}-py${{ matrix.python-version }}.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-${{ runner.os }}-py${{ matrix.python-version }}
          path: output/ci/*.log
          if-no-files-found: error
          retention-days: 14

  repair-constraints:
    name: repair-constraints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Enforce safe repair constraints
        run: >-
          python scripts/run_repair_evaluation.py --format json
          --output output/repair-evaluation.json --min-constraint-accuracy 1.0
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repair-constraint-report
          path: output/repair-evaluation.json
          if-no-files-found: error
          retention-days: 30

  container-tests:
    name: container-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --target test --tag lima:test .
      - name: Test Docker volume initialization
        shell: pwsh
        run: ./tests/test_lima_data_volumes.ps1 -Image lima:test
      - run: docker run --rm --read-only --tmpfs /tmp:rw,size=256m lima:test

  security-baseline:
    name: security-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fail on verified high-severity regressions
        # fixtures 是 E2E 故意构造的含漏洞样本语料（eval 样本必须产出
        # CWE-95 断言），与 tests/、evaluation_data/ 同为测试数据，不参与门禁；
        # 排除按目录名匹配，仓库内命中项仅 frontend/e2e/fixtures。
        run: >-
          python scripts/scan_repository.py . --sast required --format json
          --exclude-dir tests --exclude-dir evaluation_data
          --exclude-dir fixtures
          --output output/ci-security-audit.json --fail-on high --verified-only
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-baseline-report
          path: output/ci-security-audit.json
          if-no-files-found: error
          retention-days: 30

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify runner Node major version
        run: >-
          node -e "const m=Number(process.versions.node.split('.')[0]);
          if (m < 18) { console.error('node ' + m + ' is below 18'); process.exit(1); }
          console.log('node', process.versions.node);"
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck app and e2e programs
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests with coverage threshold (lines >= 60)
        run: npx vitest run --coverage
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

  frontend-e2e:
    # 冻结决策 4（Epic #33）：Playwright E2E 只在 Linux CI 运行，
    # 不进入 windows-latest 矩阵，也不要求贡献者本机执行。
    name: frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies for the backend
        run: python -m pip install -r requirements.txt
      - name: Verify runner Node major version
        run: >-
          node -e "const m=Number(process.versions.node.split('.')[0]);
          if (m < 18) { console.error('node ' + m + ' is below 18'); process.exit(1); }
          console.log('node', process.versions.node);"
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the SPA served by the api handler
        run: npm run build
        working-directory: frontend
      - name: Run audit lifecycle E2E
        run: npx playwright test
        working-directory: frontend
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-e2e-report
          path: frontend/test-results/
          if-no-files-found: error
          retention-days: 14

  merge-gate:
    name: merge-gate
    if: always()
    needs:
      - quality-contracts
      - unit-tests
      - repair-constraints
      - container-tests
      - security-baseline
      - frontend-tests
      - frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every engineering gate
        shell: bash
        run: |
          test "${{ needs.quality-contracts.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.repair-constraints.result }}" = "success"
          test "${{ needs.container-tests.result }}" = "success"
          test "${{ needs.security-baseline.result }}" = "success"
          test "${{ needs.frontend-tests.result }}" = "success"
          test "${{ needs.frontend-e2e.result }}" = "success"
  cxx-sidecar-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the pinned Sidecar test image
        run: >-
          docker build --file cxx_analyzer/Dockerfile --target test
          --tag lima-cxx-analyzer:test .
      - name: Exercise all 24 fixtures without network access
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,size=64m,mode=0700,uid=10002,gid=10002
          --tmpfs /work:rw,exec,size=512m,mode=0700,uid=10002,gid=10002
          --cap-drop ALL --security-opt no-new-privileges:true
          --user 10002:10002 lima-cxx-analyzer:test
          python -m unittest -v
          tests.test_cxx_analyzer.SourceScanContainerTests
          tests.test_cxx_analyzer.BuildScanContainerTests
          tests.test_cxx_analyzer.SanitizerContainerTests
      - name: Validate Compose security constraints
        env:
          LIMA_POSTGRES_PASSWORD: ci-only-database-password
          LIMA_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-bytes
          LIMA_BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
        run: docker compose config --quiet
      - name: Build LIMA and Sidecar runtime images
        run: |
          docker build --target runtime --tag lima:ci .
          docker build --file cxx_analyzer/Dockerfile --target runtime --tag lima-cxx-analyzer:ci .
      - name: Start LIMA and Sidecar on an internal-only network
        run: |
          docker network create --internal lima-cxx-ci
          docker run --detach --name lima-cxx-analyzer --network lima-cxx-ci \
            --read-only --tmpfs /tmp:rw,size=64m,mode=0700,uid=10002,gid=10002 \
            --tmpfs /work:rw,exec,size=512m,mode=0700,uid=10002,gid=10002 \
            --cap-drop ALL --security-opt no-new-privileges:true --user 10002:10002 \
            --mount type=bind,source="${PWD}/tests/fixtures/cxx_memory",target=/repositories/fixtures,readonly \
            lima-cxx-analyzer:ci
          docker run --detach --name lima-cxx-app --network lima-cxx-ci \
            --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,source="${PWD}/tests/fixtures/cxx_memory",target=/repositories/fixtures,readonly \
            --env LIMA_REPOSITORY_IMPORT_ROOT=/repositories \
            --env LIMA_DB_PATH=/tmp/lima.db \
            --env LIMA_CXX_MEMORY_MODE=required \
            --env LIMA_CXX_ANALYZER_URL=http://lima-cxx-analyzer:8090 \
            --env LIMA_AUTH_REQUIRED=true \
            --env LIMA_AUTH_SECRET=ci-only-auth-secret-with-at-least-32-bytes \
            --env LIMA_BOOTSTRAP_ADMIN_USERNAME=admin \
            --env LIMA_BOOTSTRAP_ADMIN_PASSWORD=ci-only-admin-password \
            lima:ci
      - name: Probe the real LIMA-to-Sidecar protocol
        run: |
          for attempt in $(seq 1 30); do
            docker exec lima-cxx-app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()" && break
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          docker exec lima-cxx-app python -c "import json; from pathlib import Path; from lima.cxx_memory import CxxMemoryAnalyzerClient; from lima.workspace import RepositoryWorkspace; root=Path('/repositories/fixtures'); assert len(json.loads((root/'manifest.json').read_text())) == 24; inventory=RepositoryWorkspace(root).inventory(); snapshot=inventory.fingerprint(); result=CxxMemoryAnalyzerClient('http://lima-cxx-analyzer:8090',300,2097152).analyze('fixtures',snapshot,('source-only',),inventory=inventory); assert result.status == 'completed'"
      - name: Stop isolated integration containers
        if: always()
        run: |
          docker rm --force lima-cxx-app lima-cxx-analyzer 2>/dev/null || true
          docker network rm lima-cxx-ci 2>/dev/null || true

  public-cxx-memory-evaluation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case-id:
          - curl-curl-cve-2026-8925
          - podofo-podofo-cve-2025-9394
          - goaccess-cve-2026-55777
          - goaccess-cve-2026-54715
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/cxx-memory/archives
          key: cxx-memory-archives-${{ hashFiles('evaluation_data/cxx_memory_cases.json') }}
      - name: Select one committed case and its trusted administrator argv
        id: case
        run: >-
          python scripts/prepare_cxx_memory_evaluation_case.py
          --cases evaluation_data/cxx_memory_cases.json
          --case-id "${{ matrix.case-id }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Build the analyzer and prepare shared cache
        env:
          LIMA_CXX_BUILD_STEPS_JSON: ${{ steps.case.outputs.build_steps_json }}
          LIMA_CXX_TEST_STEPS_JSON: ${{ steps.case.outputs.test_steps_json }}
        run: |
          mkdir -p .cache/cxx-memory/repositories output
          docker build --file cxx_analyzer/Dockerfile --target runtime --tag lima-cxx-analyzer:eval .
          ANALYZER_IMAGE_DIGEST="$(docker image inspect --format '{{.Id}}' lima-cxx-analyzer:eval)"
          printf 'ANALYZER_IMAGE_DIGEST=%s\n' "$ANALYZER_IMAGE_DIGEST" >> "$GITHUB_ENV"
          ANALYZER_BASE_IMAGE_DIGEST="$(docker image inspect --format '{{.Id}}' public.ecr.aws/docker/library/python:3.11-slim@sha256:b1add8a6f2aca6bcfcf0b9c9b522352f7ce0d62a3d556a2f2f32511aa0cca250)"
          printf 'ANALYZER_BASE_IMAGE_DIGEST=%s\n' "$ANALYZER_BASE_IMAGE_DIGEST" >> "$GITHUB_ENV"
          docker image inspect lima-cxx-analyzer:eval > output/image-inspect.json
          docker run --rm --network none --read-only --cap-drop ALL \
            lima-cxx-analyzer:eval cat \
            /usr/local/share/lima/analyzer-toolchain-packages.txt > output/debian-packages.txt
          docker run --rm --network none --read-only --cap-drop ALL \
            lima-cxx-analyzer:eval cat \
            /usr/local/share/lima/analyzer-python-packages.txt > output/python-packages.txt
          docker network create --internal lima-cxx-public
          docker run --detach --name lima-cxx-public-analyzer --network lima-cxx-public \
            --read-only --tmpfs /tmp:rw,size=64m,mode=0700,uid=10002,gid=10002 \
            --tmpfs /work:rw,exec,size=512m,mode=0700,uid=10002,gid=10002 \
            --cap-drop ALL --security-opt no-new-privileges:true --user 10002:10002 \
            --env LIMA_CXX_AUTO_CMAKE=false \
            --env LIMA_CXX_BUILD_STEPS_JSON \
            --env LIMA_CXX_TEST_STEPS_JSON \
            --mount type=bind,source="${PWD}/.cache/cxx-memory/repositories",target=/repositories,readonly \
            lima-cxx-analyzer:eval
      - name: Run pinned public pairs from a separate evaluator
        env:
          LIMA_CXX_EVALUATION_CASE_ID: ${{ matrix.case-id }}
        run: |
          for attempt in $(seq 1 30); do
            docker exec lima-cxx-public-analyzer python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()" && break
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          docker create --name lima-cxx-evaluator \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env LIMA_CXX_EVALUATION_CASE_ID \
            --mount type=bind,source="${PWD}",target=/workspace,readonly \
            --mount type=bind,source="${PWD}/.cache/cxx-memory",target=/cache \
            --mount type=bind,source="${PWD}/output",target=/output \
            --workdir /workspace \
            public.ecr.aws/docker/library/python:3.11-slim@sha256:b1add8a6f2aca6bcfcf0b9c9b522352f7ce0d62a3d556a2f2f32511aa0cca250 \
            python scripts/run_cxx_memory_evaluation.py \
              --cases evaluation_data/cxx_memory_cases.json --cache-dir /cache \
              --output /output/cxx-memory-evaluation.json \
              --analyzer-url http://lima-cxx-public-analyzer:8090 \
              --analyzer-image-digest "$ANALYZER_IMAGE_DIGEST" \
              --analyzer-base-image-digest "$ANALYZER_BASE_IMAGE_DIGEST" \
              --fail-under-precision 0.0
          docker network connect lima-cxx-public lima-cxx-evaluator
          docker start --attach lima-cxx-evaluator
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: evaluation-report-${{ matrix.case-id }}
          path: output/cxx-memory-evaluation.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: debian-packages-${{ matrix.case-id }}
          path: output/debian-packages.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-packages-${{ matrix.case-id }}
          path: output/python-packages.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: image-inspect-${{ matrix.case-id }}
          path: output/image-inspect.json
          if-no-files-found: warn
      - name: Stop public evaluation containers
        if: always()
        run: |
          docker rm --force lima-cxx-evaluator lima-cxx-public-analyzer 2>/dev/null || true
          docker network rm lima-cxx-public 2>/dev/null || true

