[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-security-agent"
dynamic = ["version"]
description = "LIMA: evidence-driven repository vulnerability mining and verified auto-repair agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "LIMA Contributors"}]
keywords = ["ai-security", "code-audit", "vulnerability-detection", "automated-repair"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.setuptools.packages.find]
include = ["lima*"]

[tool.setuptools.dynamic]
version = {attr = "lima.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["output", "repositories", ".git", ".venv"]
